<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Generated Page</title>
  <meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="global.css">
  <style id="sections-styles">
/* CSS for section section:Header */
#section-header {
  height: 72px;
  position: relative;
  overflow: hidden;
  background: linear-gradient(135deg, #b9d133 0%, #a0b82d 100%);
}
.app-header {
  width: 100%;
  height: 100%;
  display: flex;
  align-items: center;
  padding-left: 24px;
  position: relative;
  z-index: 1;
  box-sizing: border-box;
}
.header-bg-effects {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  opacity: 0.1;
  z-index: -1;
  pointer-events: none;
}
.blur-circle-1 {
  position: absolute;
  width: 256px;
  height: 256px;
  background: #ffffff;
  border-radius: 50%;
  filter: blur(128px);
  top: -128px;
  right: -122px;
}
.blur-circle-2 {
  position: absolute;
  width: 192px;
  height: 192px;
  background: #ffffff;
  border-radius: 50%;
  filter: blur(80px);
  top: -24px;
  left: -96px;
}
.header-logo {
  height: 40px;
  width: auto;
  object-fit: contain;
}

/* CSS for section section:ChatArea */
#section-chat {
  height: 704px;
  background-color: #fffcf7;
  overflow-y: auto;
}
.chat-main {
  padding: 16px 12px;
  display: flex;
  flex-direction: column;
  box-sizing: border-box;
  min-height: 100%;
}
.message-row {
  display: flex;
  gap: 12px;
  align-items: flex-start;
}
.avatar-wrapper {
  width: 36px;
  flex-shrink: 0;
}
.avatar-border {
  width: 36px;
  height: 36px;
  border-radius: 50%;
  background-color: #ffffff;
  border: 1.7px solid rgba(185, 209, 51, 0.2);
  box-shadow: 0px 2px 4px -2px rgba(0, 0, 0, 0.1), 0px 4px 6px -1px rgba(0, 0, 0, 0.1);
  display: flex;
  justify-content: center;
  align-items: center;
  box-sizing: border-box;
}
.avatar-img {
  width: 28.5px;
  height: 28.5px;
  border-radius: 50%;
  object-fit: cover;
}
.message-content {
  display: flex;
  flex-direction: column;
  gap: 4px;
  max-width: 292.8px;
}
.message-bubble {
  background-color: #ffffff;
  border: 1.7px solid rgba(185, 209, 51, 0.1);
  border-radius: 16px;
  padding: 12px 16px;
  box-shadow: 0px 2px 12px 0px rgba(185, 209, 51, 0.12);
  box-sizing: border-box;
}
.message-text {
  margin: 0;
  color: #2d2d2d;
  font-size: 14px;
  line-height: 1.5;
}
.message-meta {
  padding-left: 4px;
}
.message-time {
  color: #99a1af;
  font-size: 12px;
}

/* CSS for section section:InputArea */
#section-input {
  height: 68px;
  background-color: #ffffff;
  border-top: 1px solid rgba(185, 209, 51, 0.2);
}
.app-footer {
  height: 100%;
  box-sizing: border-box;
}
.input-wrapper {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 12px;
  height: 100%;
  box-sizing: border-box;
}
.chat-input {
  flex: 1;
  height: 43.4px;
  background-color: #faf8f5;
  border: 1.7px solid rgba(185, 209, 51, 0.2);
  border-radius: 22px;
  padding: 0 16px;
  font-size: 14px;
  color: #0a0a0a;
  box-sizing: border-box;
  outline: none;
  font-family: 'Inter', sans-serif;
}
.chat-input::placeholder {
  color: rgba(10, 10, 10, 0.5);
}
.send-btn {
  width: 36px;
  height: 36px;
  border-radius: 50%;
  background: linear-gradient(135deg, #b9d133 0%, #a0b82d 100%);
  border: none;
  display: flex;
  justify-content: center;
  align-items: center;
  box-shadow: 0px 4px 6px -4px rgba(0, 0, 0, 0.1), 0px 10px 15px -3px rgba(0, 0, 0, 0.1);
  cursor: pointer;
  opacity: 0.5;
  flex-shrink: 0;
  padding: 0;
}
.send-icon {
  width: 16px;
  height: 16px;
}

  @media (min-width: 768px) {
    #section-header {
      border-radius: 16px 16px 0 0;
    }
    #section-input {
      border-radius: 0 0 16px 16px;
    }
    #section-chat {
      height: calc(100vh - 72px - 68px);
    }
    .message-content {
      max-width: min(600px, 70vw);
    }
  }
  </style>
  <script src="global.js" defer></script>
</head>
<body>
<section id="section-header">
  <header class="app-header">
    <div class="header-bg-effects">
      <div class="blur-circle-1"></div>
      <div class="blur-circle-2"></div>
    </div>
    <img src="images/04d4a0f6c7e1149d157bd30b53de1c9e65ca5113.png" alt="KFL Supermarket Logo" class="header-logo">
  </header>
</section>
<section id="section-chat">
  <main class="chat-main">
    <div class="message-row">
      <div class="avatar-wrapper">
        <div class="avatar-border">
          <img src="images/8e561c7b03b8ff974f9dbb811245c6bfc6141764.png" alt="Concierge Avatar" class="avatar-img">
        </div>
      </div>
      <div class="message-content">
        <div class="message-bubble">
          <p class="message-text">Hello! I'm your KFL product concierge. I'm here to help you discover the finest meats and seafood. What are you looking to prepare today?</p>
        </div>
        <div class="message-meta">
          <span class="message-time">04:12</span>
        </div>
      </div>
    </div>
  </main>
</section>
<section id="section-input">
  <footer class="app-footer">
    <div class="input-wrapper">
      <input type="text" class="chat-input" placeholder="Ask about products...">
      <button class="send-btn" aria-label="Send message">
        <img src="images/201_2458.svg" alt="" class="send-icon">
      </button>
    </div>
  </footer>
</section>
</body>
</html>
