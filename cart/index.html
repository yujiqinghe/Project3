<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shopping Cart — KFL Supermarket</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Manrope:wght@400;500;600;700&family=Montserrat:wght@700&family=Poppins:wght@500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="global.css">
  <style id="sections-styles">
/* Mobile layout (unchanged) */
.cart-mobile {
  position: relative;
  width: 100%;
  min-height: 100vh;
}
.cart-mobile .app-header {
  position: absolute;
  top: 9px;
  left: 15px;
  z-index: 10;
}
.cart-mobile .back-icon {
  width: 23px;
  height: 41px;
  display: block;
  object-fit: contain;
}
.cart-mobile .cart-title {
  position: absolute;
  top: 66px;
  left: 24px;
  font-size: 24px;
  font-weight: 700;
  color: #1e222b;
  z-index: 5;
}
.cart-mobile .cart-items {
  position: absolute;
  top: 110px;
  left: 24px;
  right: 24px;
  bottom: 290px;
  overflow-y: auto;
  z-index: 5;
}
.cart-mobile .background-lines {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  pointer-events: none;
  z-index: 1;
}
.cart-mobile .line {
  position: absolute;
  left: 24px;
  width: 327px;
  height: 1px;
  background-color: #ebebfb;
}
.cart-mobile .line-1 { top: 383px; }
.cart-mobile .line-2 { top: 538px; }
.cart-mobile .checkout-sheet {
  position: absolute;
  bottom: 17px;
  left: 15px;
  width: 359px;
  background-color: #f8f9fb;
  border-radius: 30px;
  display: flex;
  flex-direction: column;
  z-index: 20;
  padding: 17px 36px 22px;
}
.cart-mobile .summary-row {
  display: flex;
  justify-content: space-between;
  line-height: 20px;
}
.cart-mobile .summary-row .label {
  color: #616a7d;
  font-size: 14px;
}
.cart-mobile .summary-row .value {
  color: #1e222b;
  font-size: 14px;
  font-weight: 500;
}
.cart-mobile .summary-row.delivery { margin-top: 13px; }
.cart-mobile .summary-row.total { margin-top: 16px; }
.cart-mobile .checkout-btn {
  margin-top: 35px;
  width: 100%;
  height: 56px;
  background-color: #b9d133;
  border-radius: 20px;
  border: none;
  color: #ffffff;
  font-size: 16px;
  font-weight: 600;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: opacity 0.2s ease;
}
.cart-mobile .checkout-btn:hover {
  opacity: 0.9;
}
@media (max-width: 480px) {
  .cart-mobile .cart-items {
    left: 16px;
    right: 16px;
    bottom: 260px;
  }
  .cart-mobile .checkout-sheet {
    left: 10px;
    width: calc(100% - 20px);
    bottom: 10px;
  }
  .cart-mobile .line {
    left: 16px;
    width: calc(100% - 32px);
  }
}
  </style>
  <script src="global.js" defer></script>
</head>
<body>
<div class="cart-page">
  <div class="cart-mobile cart-mobile-only">
    <section id="section-header">
      <header class="app-header">
        <a href="../home/index.html" aria-label="Go back">
          <img src="images/662263963a09ad97a79e16d938e1ce636afde565.png" alt="Back" class="back-icon">
        </a>
      </header>
    </section>
    <section id="section-content">
      <div class="cart-title">Shopping Cart</div>
      <div class="cart-items" id="cart-items-mobile"></div>
      <div class="background-lines">
        <div class="line line-1"></div>
        <div class="line line-2"></div>
      </div>
    </section>
    <section id="section-checkout">
      <div class="checkout-sheet">
        <div class="summary-row subtotal">
          <span class="label">Subtotal</span>
          <span class="value" id="subtotal-value-mobile">$0.00</span>
        </div>
        <div class="summary-row delivery">
          <span class="label">Delivery</span>
          <span class="value" id="delivery-value-mobile">$2.00</span>
        </div>
        <div class="summary-row total">
          <span class="label">Total</span>
          <span class="value" id="total-value-mobile">$0.00</span>
        </div>
        <button type="button" class="checkout-btn" id="checkout-btn-mobile">Proceed To checkout</button>
      </div>
    </section>
  </div>

  <div class="purchase-desktop purchase-desktop-only">
    <header class="purchase-desktop-header">
      <a href="../home/index.html" class="purchase-desktop-back">
        <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m12 19-7-7 7-7"></path><path d="M19 12H5"></path></svg>
        <span>Continue Shopping</span>
      </a>
      <h1 class="purchase-desktop-header-title">Checkout</h1>
    </header>
    <main class="purchase-desktop-main">
      <div class="purchase-desktop-layout">
        <div class="purchase-desktop-left">
          <h2 class="purchase-desktop-cart-heading">Your Cart</h2>
          <div class="purchase-desktop-items" id="cart-items-desktop"></div>

          <section class="purchase-desktop-section">
            <h2 class="purchase-desktop-section-title">Delivery Address</h2>
            <div class="purchase-desktop-card">
              <div class="purchase-desktop-card-inner">
                <div>
                  <p class="purchase-desktop-card-muted">Home</p>
                  <p class="purchase-desktop-card-strong">36 green way, Sunbury</p>
                </div>
                <button type="button" class="purchase-desktop-edit">
                  <span>Edit</span>
                  <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17 3a2.85 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z"></path></svg>
                </button>
              </div>
            </div>
          </section>

          <section class="purchase-desktop-section purchase-desktop-section--payment">
            <h2 class="purchase-desktop-section-title">Payment Method</h2>
            <div class="purchase-desktop-card purchase-desktop-card--payment">
              <div class="purchase-desktop-card-inner">
                <div>
                  <p class="purchase-desktop-card-muted">Visa</p>
                  <p class="purchase-desktop-card-strong">•••• •••• •••• 4242</p>
                </div>
                <button type="button" class="purchase-desktop-edit">
                  <span>Edit</span>
                  <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17 3a2.85 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z"></path></svg>
                </button>
              </div>
            </div>
          </section>
        </div>

        <aside class="purchase-desktop-summary-col">
          <div class="purchase-desktop-summary">
            <h2 class="purchase-desktop-summary-title">Order Summary</h2>
            <div class="purchase-desktop-summary-rows">
              <div class="purchase-desktop-summary-row">
                <span class="purchase-desktop-summary-label">Subtotal</span>
                <span class="purchase-desktop-summary-value" id="subtotal-value-desktop">$0.00</span>
              </div>
              <hr class="purchase-desktop-divider">
              <div class="purchase-desktop-summary-row">
                <span class="purchase-desktop-summary-label">Delivery</span>
                <span class="purchase-desktop-summary-value" id="delivery-value-desktop">$2.00</span>
              </div>
              <hr class="purchase-desktop-divider purchase-desktop-divider--thick">
              <div class="purchase-desktop-summary-row purchase-desktop-summary-row--total">
                <span class="purchase-desktop-summary-label">Total</span>
                <span class="purchase-desktop-summary-value" id="total-value-desktop">$0.00</span>
              </div>
            </div>
            <button type="button" class="purchase-desktop-submit" id="checkout-btn-desktop">Complete Purchase</button>
          </div>
        </aside>
      </div>
    </main>
  </div>
</div>
</body>
</html>
