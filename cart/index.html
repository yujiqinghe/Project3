<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Generated Page</title>
  <meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="global.css">
  <style id="sections-styles">
/* CSS for section section:Header */
.app-header {
    position: absolute;
    top: 9px;
    left: 15px;
    z-index: 10;
  }
  .back-icon {
    width: 23px;
    height: 41px;
    display: block;
    object-fit: contain;
  }

/* CSS for section section:Content */
.background-lines {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    z-index: 1;
  }
  .line {
    position: absolute;
    left: 24px;
    width: 327px;
    height: 1px;
    background-color: #ebebfb;
  }
  .line-1 {
    top: 383px;
  }
  .line-2 {
    top: 538px;
  }

/* CSS for section section:Checkout */
.checkout-sheet {
    position: absolute;
    bottom: 17px;
    left: 15px;
    width: 359px;
    height: 266px;
    background-color: #f8f9fb;
    border-radius: 30px;
    display: flex;
    flex-direction: column;
    z-index: 20;
  }
  .summary-row {
    display: flex;
    justify-content: space-between;
    padding-left: 36px;
    padding-right: 30px;
    line-height: 20px;
  }
  .summary-row .label {
    color: #616a7d;
    font-size: 14px;
  }
  .summary-row .value {
    color: #1e222b;
    font-size: 14px;
    font-weight: 500;
  }
  .summary-row.subtotal {
    margin-top: 17px;
  }
  .summary-row.delivery {
    margin-top: 13px;
  }
  .summary-row.total {
    margin-top: 16px;
  }
  .checkout-btn {
    margin-top: 35px;
    margin-left: 16px;
    width: 327px;
    height: 56px;
    background-color: #b9d133;
    border-radius: 20px;
    border: none;
    color: #ffffff;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: opacity 0.2s ease;
  }
  .checkout-btn:hover {
    opacity: 0.9;
  }
  </style>
  <script src="global.js" defer></script>
</head>
<body>
<section id="section-header">
  <header class="app-header">
    <a href="../home/index.html" aria-label="Go back">
      <img src="images/662263963a09ad97a79e16d938e1ce636afde565.png" alt="Back" class="back-icon">
    </a>
  </header>
</section>
<section id="section-content">
  <div class="cart-title">Shopping Cart</div>
  <div class="cart-items" id="cart-items"></div>
  <div class="background-lines">
    <div class="line line-1"></div>
    <div class="line line-2"></div>
  </div>
</section>
<section id="section-checkout">
  <div class="checkout-sheet">
    <div class="summary-row subtotal">
      <span class="label">Subtotal</span>
      <span class="value" id="subtotal-value">$0.00</span>
    </div>
    <div class="summary-row delivery">
      <span class="label">Delivery</span>
      <span class="value" id="delivery-value">$2.00</span>
    </div>
    <div class="summary-row total">
      <span class="label">Total</span>
      <span class="value" id="total-value">$0.00</span>
    </div>
    <button class="checkout-btn" id="checkout-btn">Proceed To checkout</button>
  </div>
</section>
</body>
</html>
