/* CSS for section section:Header */
.site-header {
    position: relative;
    padding: 20px 16px;
    height: 179px;
    box-sizing: border-box;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
  }
  .header-bg {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    z-index: 0;
  }
  .header-top {
    position: relative;
    z-index: 1;
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 20px;
  }
  .logo {
    height: 45px;
    width: auto;
  }
  .header-actions {
    display: flex;
    gap: 12px;
    align-items: center;
  }
  .icon-cart, .icon-menu {
    width: 41px;
    height: 41px;
    object-fit: contain;
  }
  .search-bar {
    position: relative;
    z-index: 1;
    display: flex;
    justify-content: space-between;
    align-items: center;
    border: 1px solid #000000;
    border-radius: 32px;
    padding: 0 16px;
    height: 48px;
    background-color: transparent;
    margin-bottom: 10px;
  }
  .search-placeholder {
    color: #000000;
    font-size: 16px;
  }
  .icon-search {
    width: 41px;
    height: 41px;
    object-fit: contain;
  }

/* CSS for section section:Hero */
.hero-wrapper {

  }
  .hero-banner {
    position: relative;
    border-radius: 12px;
    overflow: hidden;
    height: 189px;
  }
  .hero-img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }
  .hero-content {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    padding: 40px 16px;
    box-sizing: border-box;
    display: flex;
    flex-direction: column;
    justify-content: center;
  }
  .hero-title {
    font-size: 22px;
    font-weight: 700;
    color: #000000;
    margin-bottom: 4px;
  }
  .hero-subtitle {
    font-size: 14px;
    color: #000000;
    margin-bottom: 16px;
  }
  .shop-now-btn {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    background: transparent;
    border: 1px solid #000000;
    border-radius: 6px;
    padding: 6px 12px;
    font-size: 12px;
    font-weight: 600;
    color: #000000;
    cursor: pointer;
    width: fit-content;
  }
  .icon-arrow {
    width: 16px;
    height: 16px;
  }
  .pagination {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 6px;
    margin-top: 16px;
  }
  .dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background-color: #c4c4c4;
  }
  .dot.active {
    width: 16px;
    border-radius: 4px;
    background-color: #1e222b;
  }
  .cart-link {
    position: relative;
    display: inline-block;
  }
  .cart-badge {
    position: absolute;
    top: -4px;
    right: -4px;
    background-color: #f9b023;
    color: #ffffff;
    font-size: 10px;
    font-weight: 700;
    width: 18px;
    height: 18px;
    border-radius: 50%;
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 2;
  }
