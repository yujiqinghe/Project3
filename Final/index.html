<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Generated Page</title>
  <meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="global.css">
  <style id="sections-styles">
/* CSS for section section:OrderSuccess */
.order-success-section {
    width: 100%;
    display: flex;
    justify-content: center;
}

.app-container {
    width: 100%;
    max-width: clamp(320px, 90vw, 600px); /* Fluid width */
    background-color: #ffffff;
    min-height: 844px; /* Based on Figma root frame height */
    position: relative;
    /* Padding based on the absolute positioning of the child node (x: 24, y: 126) */
    padding-top: 126px;
    padding-left: 24px;
    padding-right: 24px;
    overflow: hidden;
}

.success-image {
    width: 100%;
    max-width: 342px; /* Based on Figma child node width */
    height: auto;
    display: block;
    margin: 0 auto;
}
.continue-btn {
    display: block;
    margin: 30px auto 0;
    padding: 14px 32px;
    background-color: #b9d133;
    color: #ffffff;
    border: none;
    border-radius: 20px;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    text-decoration: none;
    text-align: center;
    width: fit-content;
}

/* Responsive adjustments for mobile devices */
@media (max-width: 480px) {
    .app-container {
        max-width: 100%;
        min-height: 100vh;
        box-shadow: none;
        padding-left: 16px;
        padding-right: 16px;
    }
}

/* PC optimization */
@media (min-width: 768px) {
    .app-container {
        min-height: 100vh;
        padding-left: 48px;
        padding-right: 48px;
    }
}
  </style>
  <script src="global.js" defer></script>
</head>
<body>
<section id="section-order-success" class="order-success-section">
    <div class="app-container">
        <img src="images/151b918b8884bfb8e523185fbb54f53541b4fc4e.png" alt="Order successfully accepted" class="success-image">
        <a href="../home/index.html" class="continue-btn">Continue Shopping</a>
    </div>
</section>
</body>
</html>
