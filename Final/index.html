<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Order Confirmed — KFL Supermarket</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Manrope:wght@400;600;700&family=Montserrat:wght@700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="global.css">
  <style id="sections-styles">
/* —— Mobile layout (unchanged) —— */
.confirm-mobile-only .app-container {
  width: 100%;
  max-width: clamp(320px, 90vw, 600px);
  background-color: #ffffff;
  min-height: 844px;
  position: relative;
  padding-top: 126px;
  padding-left: 24px;
  padding-right: 24px;
  overflow: hidden;
  margin: 0 auto;
}

.confirm-mobile-only .success-image {
  width: 100%;
  max-width: 342px;
  height: auto;
  display: block;
  margin: 0 auto;
}

.confirm-mobile-only .continue-btn {
  display: block;
  margin: 30px auto 0;
  padding: 14px 32px;
  background-color: #b9d133;
  color: #ffffff;
  border: none;
  border-radius: 20px;
  font-size: 16px;
  font-weight: 600;
  cursor: pointer;
  text-decoration: none;
  text-align: center;
  width: fit-content;
}

@media (max-width: 480px) {
  .confirm-mobile-only .app-container {
    max-width: 100%;
    min-height: 100vh;
    padding-left: 16px;
    padding-right: 16px;
  }
}
  </style>
  <script src="global.js" defer></script>
</head>
<body>
<div class="confirm-page">
  <!-- Mobile -->
  <section id="section-order-success" class="order-success-section confirm-mobile-only">
    <div class="app-container">
      <img src="images/151b918b8884bfb8e523185fbb54f53541b4fc4e.png" alt="Order successfully accepted" class="success-image">
      <a href="../home/index.html" class="continue-btn">Continue Shopping</a>
    </div>
  </section>

  <!-- Desktop (laptop-adaption3 OrderConfirmation) -->
  <main class="confirm-desktop-only">
    <div class="confirm-desktop-inner">
      <div class="confirm-desktop-icon-wrap">
        <img src="images/151b918b8884bfb8e523185fbb54f53541b4fc4e.png" alt="Order Success" class="confirm-desktop-icon">
      </div>
      <h1 class="confirm-desktop-heading">Your Order has been accepted</h1>
      <p class="confirm-desktop-subtext">Your items has been placed and is on it's way to being processed</p>

      <div class="confirm-desktop-details">
        <div class="confirm-desktop-detail">
          <p class="confirm-desktop-detail-label">Order Number</p>
          <p class="confirm-desktop-detail-value" id="order-number">#ORD-2024-0412</p>
        </div>
        <div class="confirm-desktop-detail-divider" aria-hidden="true"></div>
        <div class="confirm-desktop-detail">
          <p class="confirm-desktop-detail-label">Total Amount</p>
          <p class="confirm-desktop-detail-value" id="order-total">$64.00</p>
        </div>
        <div class="confirm-desktop-detail-divider" aria-hidden="true"></div>
        <div class="confirm-desktop-detail">
          <p class="confirm-desktop-detail-label">Estimated Delivery</p>
          <p class="confirm-desktop-detail-value">2-3 Days</p>
        </div>
      </div>

      <div class="confirm-desktop-actions">
        <button type="button" class="confirm-desktop-btn confirm-desktop-btn--primary">
          <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m7.5 4.27 9 5.15"></path><path d="M21 8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16Z"></path><path d="m3.3 7 8.7 5 8.7-5"></path><path d="M12 22V12"></path></svg>
          Track Order
        </button>
        <a href="../home/index.html" class="confirm-desktop-btn confirm-desktop-btn--secondary">
          <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
          Back to Home
        </a>
      </div>
    </div>
  </main>
</div>
</body>
</html>
