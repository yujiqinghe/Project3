.header {
  display: flex;
  justify-content: space-between;

}

.header-title {
  font-size: 32px;
  font-weight: 700;

}

.header-actions {

}

.header-icon {
  width: 41px;
  height: 41px;
  object-fit: contain;
  cursor: pointer;
}

/* CSS for section section:ProductGrid */
.product-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);

  padding: 10px 15px 40px 15px;
}

.product-card {

  border-radius: 12px;

}

.product-image-wrapper {

.product-image {
