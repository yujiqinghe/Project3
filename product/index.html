<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fish — KFL Supermarket</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&family=Manrope:wght@400;600;700&family=Montserrat:wght@700&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="global.css">
  <style id="sections-styles">
/* Mobile layout (unchanged look) */
.header-mobile {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 56px 20px 20px 27px;
}

.header-title {
  font-size: 32px;
  font-weight: 700;
  color: #000000;
  margin: 0;
  line-height: 1.2;
}

.header-actions {
  display: flex;
  gap: 14px;
  align-items: center;
}

.header-icon {
  width: 41px;
  height: 41px;
  object-fit: contain;
  cursor: pointer;
}

.product-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 16px;
  padding: 16px 24px 32px;
}

.product-card {
  background-color: #f8f9fb;
  border-radius: 12px;
  position: relative;
  display: flex;
  flex-direction: column;
  padding: 16px;
  box-sizing: border-box;
}

.product-image-wrapper {
  height: 80px;
  display: flex;
  align-items: center;
  justify-content: center;
  margin-bottom: 24px;
}

.product-image {
  max-width: 100%;
  max-height: 100%;
  object-fit: contain;
  opacity: 0.6;
}

.add-btn {
  position: absolute;
  right: 12px;
  top: 90px;
  width: 24px;
  height: 24px;
  background-color: #b9d133;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  border: none;
  cursor: pointer;
  padding: 0;
}

.add-btn__text {
  display: none;
}

.add-btn__icon {
  display: block;
  width: 12px;
  height: 12px;
}

.product-info {
  display: flex;
  flex-direction: column;
  gap: 4px;
  margin-top: 0;
}

.price {
  color: #1e222b;
  font-size: 16px;
  font-weight: 700;
  line-height: 1.2;
}

.name {
  color: #616a7d;
  font-size: 12px;
  line-height: 1.4;
}

.cart-link {
  position: relative;
  display: inline-block;
}

.cart-badge {
  position: absolute;
  top: -4px;
  right: -4px;
  background-color: #f9b023;
  color: #ffffff;
  font-size: 10px;
  font-weight: 700;
  width: 18px;
  height: 18px;
  border-radius: 50%;
  display: none;
  align-items: center;
  justify-content: center;
  z-index: 2;
}

.qty-stepper {
  position: absolute;
  right: 12px;
  top: 90px;
  display: none;
  align-items: center;
  gap: 4px;
  z-index: 3;
}

.qty-stepper.active {
  display: flex;
}

.qty-stepper-btn {
  width: 24px;
  height: 24px;
  border-radius: 50%;
  border: 1px solid #ebebfb;
  background-color: #ffffff;
  color: #1e222b;
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 0;
  line-height: 1;
}

.qty-stepper-count {
  font-size: 14px;
  font-weight: 600;
  color: #1e222b;
  min-width: 18px;
  text-align: center;
}

.product-title-desktop {
  display: none;
}

.product-main {
  display: block;
}
  </style>
  <script src="global.js" defer></script>
</head>
<body>
<div class="product-page">
  <section id="section-header-mobile">
    <header class="header header-mobile">
      <h1 class="header-title">Fish</h1>
      <div class="header-actions">
        <a href="../cart/index.html" class="cart-link" aria-label="Shopping Cart">
          <img src="images/b9cfbe1d6eb32a6c5ac37ff59f12ec6048ff589f.png" alt="" class="header-icon">
          <span class="cart-badge">0</span>
        </a>
        <img src="images/a7859c6a55c5276e55ad6a269202011b8e2cb1bc.png" alt="" class="header-icon">
      </div>
    </header>
  </section>

  <section id="section-header-desktop" aria-label="Site header">

            <circle cx="11" cy="11" r="8"></circle>
            <path d="m21 21-4.3-4.3"></path>
          </svg>
          <input type="search" class="header-desktop__search" placeholder="Search products..." autocomplete="off">
        </div>
      </div>
      <div class="header-desktop__actions">
        <a href="../home/index.html" class="header-desktop__icon-btn" aria-label="Home">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
            <polyline points="9 22 9 12 15 12 15 22"></polyline>
          </svg>
        </a>
        <a href="../cart/index.html" class="cart-link header-desktop__icon-btn" aria-label="Shopping Cart">
          <img src="images/b9cfbe1d6eb32a6c5ac37ff59f12ec6048ff589f.png" alt="" width="32" height="32">
          <span class="cart-badge">0</span>
        </a>
      </div>
    </header>
