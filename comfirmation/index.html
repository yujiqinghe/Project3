<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Checkout — KFL Supermarket</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="global.css">
  <style id="sections-styles">
.checkout-mobile-only {
  display: flex;
  flex-direction: column;
  min-height: 100vh;
}
#section-header .header-container {
  padding: 20px 31px 10px;
  height: 61px;
  box-sizing: border-box;
}
#section-header .back-link {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 44px;
  height: 44px;
  border-radius: 50%;
  transition: all 0.2s ease;
  margin-left: -10px;
}
#section-header .back-link:hover {
  background-color: rgba(0, 0, 0, 0.05);
}
#section-header .back-icon-svg {
  width: 28px;
  height: 28px;
  display: block;
}
#section-address .address-container {
  padding: 0 31px;
}
#section-address .section-title,
#section-payment .section-title {
  font-size: 16px;
  color: #1e222b;
  margin: 0 0 14px 2px;
  font-weight: 500;
  line-height: 20px;
}
#section-address .info-card {
  border: 2px solid #f9b023;
  border-radius: 12px;
  height: 96px;
  margin-bottom: 24px;
  padding: 16px 20px;
  box-sizing: border-box;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
}
#section-payment .payment-container {
  padding: 0 31px;
}
#section-payment .info-card {
  border: 2px solid #f9b023;
  border-radius: 12px;
  height: 96px;
  margin-bottom: 24px;
  padding: 16px 20px;
  box-sizing: border-box;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  background-color: #f7f7fb;
}
.card-label {
  font-size: 14px;
  color: #1e222b;
  line-height: 20px;
}
.card-details {
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.detail-text {
  font-size: 14px;
  color: #000000;
  line-height: 20px;
}
.edit-btn {
  color: #2a4ba0;
  font-size: 14px;
  background: none;
  border: none;
  padding: 0;
  cursor: pointer;
  line-height: 16px;
  font-weight: 500;
}
#section-summary {
  flex: 1;
}
#section-summary .summary-wrapper {
  padding: 0 15px 15px;
  height: 100%;
  display: flex;
  flex-direction: column;
  justify-content: flex-end;
}
#section-summary .summary-container {
  background-color: #f8f9fb;
  border-radius: 30px;
  height: 266px;
  padding: 17px 36px 69px;
  box-sizing: border-box;
  display: flex;
  flex-direction: column;
  width: 100%;
}
#section-summary .summary-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
}
#section-summary .summary-row.subtotal { margin-bottom: 13px; }
#section-summary .summary-row.delivery { margin-bottom: 16px; }
#section-summary .summary-row.total { margin-bottom: 35px; }
#section-summary .summary-label {
  color: #616a7d;
  font-size: 14px;
  line-height: 20px;
}
#section-summary .summary-value {
  color: #1e222b;
  font-size: 14px;
  line-height: 20px;
  font-weight: 500;
}
#section-summary .checkout-btn {
  background-color: #b9d133;
  color: #ffffff;
  border-radius: 20px;
  width: 100%;
  height: 56px;
  border: none;
  font-size: 16px;
  font-weight: 600;
  cursor: pointer;
  display: flex;
  justify-content: center;
  align-items: center;
}
@media (max-width: 480px) {
  .mobile-container {
    max-width: 100%;
  }
}
  </style>
  <script>
    if (window.matchMedia('(min-width: 1024px)').matches) {
      window.location.replace('../cart/index.html');
    }
  </script>
  <script src="global.js" defer></script>
</head>
<body>
<div class="checkout-page">
  <div class="checkout-mobile-only">
    <section id="section-header">
      <div class="mobile-container header-container" style="display: flex; align-items: center; gap: 16px;">
        <a href="../cart/index.html" aria-label="Go back" class="back-link">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="#1e222b" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" class="back-icon-svg">
            <path d="m15 18-6-6 6-6"/>
          </svg>
        </a>
        <h1 style="font-size: 24px; font-weight: 700; color: #1e222b; margin: 0;">Confirmation</h1>
      </div>
    </section>
    <section id="section-address">
      <div class="mobile-container address-container">
        <h2 class="section-title">Delivery Address</h2>
        <div class="info-card">
          <div class="card-label">Home</div>
          <div class="card-details">
            <span class="detail-text">36 green way, Sunbury</span>
            <button type="button" class="edit-btn">Edit</button>
          </div>
        </div>
      </div>
    </section>
    <section id="section-payment">
      <div class="mobile-container payment-container">
        <h2 class="section-title">Card Details</h2>
        <div class="info-card">
          <div class="card-label">Visa</div>
          <div class="card-details">
            <span class="detail-text">XXXXXXX</span>
            <button type="button" class="edit-btn">Edit</button>
          </div>
        </div>
      </div>
    </section>
    <section id="section-summary">
      <div class="mobile-container summary-wrapper">
        <div class="summary-container">
          <div class="summary-row subtotal">
            <span class="summary-label">Subtotal</span>
            <span class="summary-value" id="summary-subtotal-mobile">$0.00</span>
          </div>
          <div class="summary-row delivery">
            <span class="summary-label">Delivery</span>
            <span class="summary-value" id="summary-delivery-mobile">$2.00</span>
          </div>
          <div class="summary-row total">
            <span class="summary-label">Total</span>
            <span class="summary-value" id="summary-total-mobile">$0.00</span>
          </div>
          <button type="button" class="checkout-btn" id="checkout-btn-mobile">Check Out</button>
        </div>
      </div>
    </section>
  </div>
</div>
</body>
</html>
